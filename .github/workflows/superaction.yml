# prettier/prettier's dev-test.yml: test (ubuntu-latest, Node.js 26, FULL_TEST + coverage), for the Superaction scoreboard.
name: Superaction

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test / superaction-fabric
    runs-on: superaction-fabric
    timeout-minutes: 30
    env:
      ENABLE_CODE_COVERAGE: true
      FULL_TEST: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn --immutable

      - name: Run Tests (coverage)
        run: yarn c8 yarn test

      - name: "`--debug-benchmark` flag"
        run: node bin/prettier.cjs --debug-benchmark package.json 2>&1 >/dev/null | grep "Latency avg" || exit 1
