# Debug (manual): prettier's config-invalid.js on the superaction-aws runner.
name: Superaction AWS debug
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: debug / superaction-aws
    runs-on: superaction-aws
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: yarn --immutable
      - name: find-config-path with a broken package.json
        run: |
          cd tests/integration/cli/config/invalid/broken-package-json
          ls -la; id; env | grep -iE "^(NODE|XDG|HOME|CI|PRETTIER|RUNNER_TEMP)" | sort
          echo '{"prettier":{' > package.json
          node ../../../../../../bin/prettier.cjs --find-config-path foo.js; echo "exit $?"
          echo '{"prettier":{}}' > package.json
          node ../../../../../../bin/prettier.cjs --find-config-path foo.js; echo "exit $?"
          rm package.json
          node ../../../../../../bin/prettier.cjs --find-config-path foo.js; echo "exit $?"
          stat .prettierrc; cat -A .prettierrc
          cd "$GITHUB_WORKSPACE" && git status --short | head; ls -la /home/runner/work/prettier/prettier/.git | head -3
      - name: the test alone
        run: yarn jest tests/integration/__tests__/config-invalid.js 2>&1 | tail -40
